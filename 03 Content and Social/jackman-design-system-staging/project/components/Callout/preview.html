<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Poppins:wght@400;600;700&display=swap">
<style>
body{margin:0;padding:var(--space-6);background:var(--surface);color:var(--ink);font-family:var(--font-sans),Poppins,sans-serif;display:flex;flex-direction:column;gap:var(--space-4);max-width:640px}
.co{background:var(--surface-raised);border-left:6px solid var(--bronze);padding:var(--space-4) var(--space-6)}
.co.warn{border-left-color:var(--signal)}
.co.key{border-left-color:var(--highlight)}
.co .l{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 var(--space-2)}
.co p{margin:0;font-size:16px;line-height:24px}
</style></head><body>
<div class="co"><p class="l">Note</p><p>Confirm fitment with an authorized dealer against the current Master Parts List.</p></div>
<div class="co warn"><p class="l">Warning</p><p>Torque values come from the owner's guide. Never use a figure from another vehicle.</p></div>
<div class="co key"><p class="l">Key point</p><p>Limited lifetime structural warranty and a five-year finish warranty. See full terms.</p></div>
</body></html>
